syntax = "proto3";

package entitlements.v1;

option go_package = "grpc-auth/";

import "google/protobuf/timestamp.proto";

// Authentication: send either
//   - "x-service-key: <key>" metadata, for service-to-service calls with no
//     user (any organization may be queried), or
//   - "authorization: <user JWT>" metadata, in which case the user must be a
//     member of the requested organization.
//
// Entitlements are read-only snapshots. Callers apply the plan rules
// themselves: the auth service does not count usage, so a server-side check
// could only repeat the comparison a caller makes from the snapshot. The rules
// are documented in docs/contrib/subscribers/entitlements-grpc.md.

enum SubscriptionState {
  SUBSCRIPTION_STATE_UNSPECIFIED = 0;
  // Billing is disabled in this deployment. Nothing is limited.
  SUBSCRIPTION_STATE_NOT_MANAGED = 1;
  // Never subscribed, or the first payment never completed.
  SUBSCRIPTION_STATE_NONE = 2;
  SUBSCRIPTION_STATE_TRIALING = 3;
  SUBSCRIPTION_STATE_ACTIVE = 4;
  // A renewal payment failed and is being retried. Access continues.
  SUBSCRIPTION_STATE_PAST_DUE = 5;
  // Cancelled; access has ended.
  SUBSCRIPTION_STATE_CANCELED = 6;
  // Access lapsed for any other reason (unpaid, paused, not renewed).
  SUBSCRIPTION_STATE_EXPIRED = 7;
}

enum LimitKind {
  LIMIT_KIND_UNSPECIFIED = 0;
  // Standing limit on stored records; never resets.
  LIMIT_KIND_CAP = 1;
  // Allowance that resets monthly on the billing-cycle day. Count usage
  // within [period_start, period_end).
  LIMIT_KIND_MONTHLY_QUOTA = 2;
}

message EntitlementLimit {
  LimitKind kind = 1;
  // Meaningless when unlimited is true.
  int64 limit = 2;
  bool unlimited = 3;
  // Set only for monthly quotas.
  google.protobuf.Timestamp period_start = 4;
  google.protobuf.Timestamp period_end = 5;
}

message EntitlementPlan {
  string price_id = 1;
  string name = 2;
  string tier = 3;
  int64 quantity = 4;
  int64 licenses = 5;
  string provider_status = 6;
  bool cancel_at_period_end = 7;
  google.protobuf.Timestamp current_period_end = 8;
}

message OrgEntitlements {
  string org_id = 1;
  // Whether the organization may use the application at all.
  bool entitled = 2;
  SubscriptionState state = 3;
  // Provider's raw status, for display only.
  string provider_status = 4;
  // False when billing is disabled in this deployment. Apply no limits.
  bool managed = 5;
  // False in observe mode: evaluate the rules and log denials, but do not
  // block on them.
  bool enforced = 6;
  google.protobuf.Timestamp trial_ends_at = 7;
  google.protobuf.Timestamp current_period_start = 8;
  google.protobuf.Timestamp current_period_end = 9;
  // Set only for the canceled and expired states.
  google.protobuf.Timestamp ended_at = 10;
  bool cancel_at_period_end = 11;
  repeated string features = 12;
  int64 licenses = 13;
  int64 licenses_used = 14;
  int64 licenses_available = 15;
  bool over_limit = 16;
  // Caps and monthly quotas granted by the plan. A key absent here is not
  // offered on the plan.
  map<string, EntitlementLimit> limits = 17;
  repeated EntitlementPlan plans = 18;
  // When this snapshot was computed; use it to bound how long you cache it.
  google.protobuf.Timestamp resolved_at = 19;
}

message GetEntitlementsRequest {
  string org_id = 1;
}

message BatchGetEntitlementsRequest {
  // At most 100 organizations. Service callers only.
  repeated string org_ids = 1;
}

message BatchGetEntitlementsResponse {
  map<string, OrgEntitlements> entitlements = 1;
}

service Entitlements {
  // Full entitlement snapshot for one organization.
  rpc GetEntitlements(GetEntitlementsRequest) returns (OrgEntitlements) {}
  // Snapshots for many organizations, for background jobs. Service callers only.
  rpc BatchGetEntitlements(BatchGetEntitlementsRequest) returns (BatchGetEntitlementsResponse) {}
}
