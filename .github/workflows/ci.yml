# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: CI

on:
  push:
  pull_request:
  workflow_call:

jobs:

  build:
    runs-on: ubuntu-latest
    steps:

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: 1.27

    - name: Install Tools
      # Both of these are major-versioned module paths, and the major is part
      # of the path: `@latest` on `golangci-lint/cmd/...` resolves to the last
      # v1 (v1.64.8, March 2025) and will never see a v2, which is why the
      # linter stopped understanding the toolchain rather than the toolchain
      # breaking. Pinned so a bump is a reviewable change; renovate keeps it
      # current.
      run: |
        go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
        go install github.com/onsi/ginkgo/v2/ginkgo@latest
        go install golang.org/x/tools/cmd/goimports@latest

    - uses: actions/checkout@v7

    - name: Format Check
      run: |
        go fmt ./...
        goimports -w .

    - name: Lint Check
      run: |
        golangci-lint run --timeout 2m0s

    - name: Build
      run: go build -v ./...

    - name: Test
      run: .devops/scripts/test.sh
