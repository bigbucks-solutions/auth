basePath: /api/v1
definitions:
  actions.Organization:
    properties:
      address:
        type: string
      city:
        type: string
      country:
        type: string
      description:
        maxLength: 500
        type: string
      email:
        type: string
      latitude:
        type: number
      logo_url:
        type: string
      longitude:
        type: number
      name:
        minLength: 4
        type: string
      phone:
        minLength: 5
        type: string
      postal_code:
        type: string
      state:
        type: string
      tax_id:
        type: string
      website:
        type: string
    required:
    - email
    - name
    type: object
  actions.PricingFeature:
    properties:
      description:
        type: string
      key:
        type: string
      label:
        type: string
    type: object
  actions.PricingLimit:
    properties:
      key:
        type: string
      label:
        type: string
      period:
        description: Period is "month" for allowances that reset, "total" for standing
          caps.
        type: string
      unit:
        type: string
    type: object
  actions.PricingPage:
    properties:
      available:
        description: |-
          Available is false when billing is disabled for this deployment, in which
          case the pricing page should not be rendered at all.
        type: boolean
      currencies:
        description: |-
          Currencies is every code the organization may actually buy in, sorted. A
          currency offered by only some plans is excluded, since a switcher that
          blanks one column is worse than not offering it.
        items:
          type: string
        type: array
      currency:
        description: |-
          Currency is the ISO-4217 code the page should display by default,
          resolved from the organization's country unless explicitly requested.
        type: string
      currency_locked:
        description: |-
          CurrencyLocked is true once the organization has billed and the provider
          has pinned it to a single currency. Currencies then holds only that one
          and the frontend should hide the switcher rather than offer a choice that
          would fail at checkout.
        type: boolean
      features:
        description: Features is every capability in the catalog, ordered for display.
        items:
          $ref: '#/definitions/actions.PricingFeature'
        type: array
      limits:
        description: Limits is every quota and cap in the catalog, ordered for display.
        items:
          $ref: '#/definitions/actions.PricingLimit'
        type: array
      plans:
        description: Plans is one entry per tier, cheapest first.
        items:
          $ref: '#/definitions/actions.PricingPlan'
        type: array
      trial_period_days:
        description: |-
          TrialPeriodDays is the trial Checkout grants to a new subscription. Zero
          means no trial is available.
        type: integer
    type: object
  actions.PricingPlan:
    properties:
      description:
        type: string
      features:
        description: |-
          Features lists the capability keys this tier includes. Keys absent from
          this list but present in PricingPage.Features are not included.
        items:
          type: string
        type: array
      highlight:
        type: boolean
      limits:
        additionalProperties:
          format: int64
          type: integer
        description: |-
          Limits maps a limit key to its value for this tier. -1 means unlimited.
          A key missing here is not offered at all on this tier.
        type: object
      name:
        type: string
      pricing:
        additionalProperties:
          $ref: '#/definitions/subscriptions.PriceDetail'
        description: Pricing is keyed by billing interval, "month" and/or "year".
        type: object
      tier:
        type: string
    type: object
  actions.UserListResponse:
    properties:
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
      users:
        items:
          $ref: '#/definitions/types.ListUserResponse'
        type: array
    type: object
  bigbucks_solution_auth_rest-api_controllers_types.Role:
    properties:
      description:
        type: string
      extraAttrs:
        additionalProperties: true
        type: object
      name:
        type: string
    required:
    - name
    type: object
  bigbucks_solution_auth_rest-api_controllers_types.UserInfo:
    properties:
      isSocialAccount:
        type: boolean
      organizations:
        items:
          $ref: '#/definitions/types.UserInfoOrganization'
        type: array
      profile:
        $ref: '#/definitions/types.UserInfoProfile'
      roles:
        items:
          $ref: '#/definitions/types.UserInfoRole'
        type: array
      username:
        type: string
    type: object
  constants.Action:
    enum:
    - write
    - create
    - read
    - update
    - delete
    type: string
    x-enum-varnames:
    - ActionWrite
    - ActionCreate
    - ActionRead
    - ActionUpdate
    - ActionDelete
  constants.Scope:
    enum:
    - all
    - org
    - associated
    - own
    type: string
    x-enum-varnames:
    - ScopeAll
    - ScopeOrg
    - ScopeAssociated
    - ScopeOwn
  constants.UserStatus:
    enum:
    - active
    - inactive
    - pending
    type: string
    x-enum-varnames:
    - UserStatusActive
    - UserStatusInactive
    - UserStatusPending
  controllers.AcceptInvitationResponse:
    properties:
      jwtToken:
        type: string
      message:
        type: string
    type: object
  controllers.InvitationResponse:
    properties:
      acceptedAt:
        type: string
      createdAt:
        type: string
      email:
        type: string
      expiresAt:
        type: string
      id:
        type: string
      inviter:
        $ref: '#/definitions/controllers.UserInfo'
      role:
        $ref: '#/definitions/controllers.RoleInfo'
      status:
        type: string
    type: object
  controllers.InviteUserRequest:
    properties:
      email:
        type: string
      roleId:
        type: string
    required:
    - email
    - roleId
    type: object
  controllers.JsonCred:
    properties:
      password:
        type: string
      recaptcha:
        type: string
      username:
        type: string
    type: object
  controllers.ListInvitationsResponse:
    properties:
      invitations:
        items:
          $ref: '#/definitions/controllers.InvitationResponse'
        type: array
      page:
        type: integer
      size:
        type: integer
      total:
        type: integer
    type: object
  controllers.RequestPasswordResetToken:
    properties:
      email:
        example: example@example.com
        type: string
    type: object
  controllers.ResetPassword:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  controllers.RoleInfo:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  controllers.UserInfo:
    properties:
      id:
        type: string
      username:
        type: string
    type: object
  controllers.checkoutRequestBody:
    properties:
      cancel_url:
        type: string
      currency:
        description: |-
          Currency is the ISO-4217 code to charge in. Must be one the price offers,
          as listed by GET /billing/plans. Empty uses the price's default.
        type: string
      price_id:
        description: PriceID identifies the plan, as listed by the catalog endpoint.
        type: string
      quantity:
        description: Quantity is the number of licences to buy. Defaults to 1.
        type: integer
      success_url:
        description: |-
          SuccessURL and CancelURL are paths on the configured UI origin. Absolute
          URLs pointing elsewhere are rejected and replaced with defaults.
        type: string
    type: object
  controllers.portalRequestBody:
    properties:
      flow:
        description: |-
          Flow deep-links to one task: "cancel", "update_plan" or "payment_method".
          Empty opens the portal home, which also lists past invoices.
        type: string
      return_url:
        type: string
    type: object
  controllers.webAuthnLoginRequest:
    properties:
      mediation:
        type: string
      username:
        type: string
    type: object
  gorm.DeletedAt:
    properties:
      time:
        type: string
      valid:
        description: Valid is true if Time is not NULL
        type: boolean
    type: object
  models.AuthLog:
    properties:
      attrs:
        additionalProperties: true
        type: object
      loginAt:
        type: string
      userID:
        type: string
    type: object
  models.EmailVerification:
    properties:
      codeDigest:
        items:
          type: integer
        type: array
      consumedAt:
        type: string
      createdAt:
        type: string
      deletedAt:
        $ref: '#/definitions/gorm.DeletedAt'
      email:
        type: string
      expiresAt:
        type: string
      failedAttempts:
        type: integer
      id:
        type: integer
      lastSentAt:
        type: string
      sendCount:
        type: integer
      sendWindowAt:
        type: string
      updatedAt:
        type: string
      userID:
        type: string
    type: object
  models.ForgotPassword:
    properties:
      expiry:
        type: string
      resetToken:
        type: string
      userID:
        type: string
    type: object
  models.MobileVerification:
    properties:
      createdAt:
        type: string
      deletedAt:
        $ref: '#/definitions/gorm.DeletedAt'
      expiresAt:
        type: string
      id:
        type: integer
      mobileNumber:
        type: string
      token:
        type: string
      updatedAt:
        type: string
      userID:
        type: integer
    type: object
  models.OAuthClient:
    properties:
      source:
        enum:
        - google
        - facebook
        type: string
      userID:
        type: string
    required:
    - source
    type: object
  models.Organization:
    properties:
      address:
        type: string
      city:
        type: string
      companyDescription:
        maxLength: 500
        type: string
      contactEmail:
        type: string
      contactNumber:
        minLength: 5
        type: string
      country:
        description: |-
          Country is an ISO-3166 alpha-2 code, stored upper-case. The billing
          layer maps it to a currency; see subscriptions.CurrencyConfig.
        type: string
      latitude:
        format: float64
        type: number
      logoURL:
        type: string
      longitude:
        format: float64
        type: number
      name:
        minLength: 4
        type: string
      postalCode:
        type: string
      state:
        type: string
      taxID:
        type: string
      users:
        items:
          $ref: '#/definitions/models.User'
        type: array
      websiteURL:
        type: string
    required:
    - contactEmail
    - name
    - users
    type: object
  models.OrganizationDetails:
    properties:
      address:
        type: string
      city:
        type: string
      company_description:
        type: string
      contact_email:
        type: string
      contact_number:
        type: string
      country:
        type: string
      created_at:
        type: string
      id:
        type: string
      latitude:
        type: number
      logo_url:
        type: string
      longitude:
        type: number
      name:
        type: string
      postal_code:
        type: string
      state:
        type: string
      tax_id:
        type: string
      updated_at:
        type: string
      users:
        items:
          $ref: '#/definitions/models.User'
        type: array
      website_url:
        type: string
    type: object
  models.Permission:
    properties:
      action:
        allOf:
        - $ref: '#/definitions/constants.Action'
        enum:
        - read
        - write
        - delete
        - update
        - create
        minLength: 3
      description:
        type: string
      isSystemManaged:
        description: Mark if this is a system-managed permission
        type: boolean
      resource:
        minLength: 3
        type: string
      roles:
        items:
          $ref: '#/definitions/models.Role'
        type: array
      scope:
        allOf:
        - $ref: '#/definitions/constants.Scope'
        enum:
        - own
        - org
        - associated
        - all
        minLength: 3
    required:
    - action
    - scope
    type: object
  models.Profile:
    properties:
      bio:
        maxLength: 200
        type: string
      country:
        type: string
      designation:
        type: string
      email:
        type: string
      file:
        type: string
      firstName:
        type: string
      lastName:
        type: string
      phone:
        type: string
      timezone:
        type: string
    type: object
  models.Role:
    properties:
      description:
        type: string
      extraAttrs:
        additionalProperties: true
        type: object
      isSystemRole:
        description: Mark if this is a system-managed role
        type: boolean
      name:
        minLength: 4
        type: string
      orgID:
        type: string
      permissions:
        items:
          $ref: '#/definitions/models.Permission'
        type: array
      users:
        items:
          $ref: '#/definitions/models.User'
        type: array
    required:
    - name
    type: object
  models.User:
    properties:
      emailVerification:
        $ref: '#/definitions/models.EmailVerification'
      emailVerified:
        type: boolean
      forgotPassword:
        $ref: '#/definitions/models.ForgotPassword'
      lastLogin:
        $ref: '#/definitions/models.AuthLog'
      mobileVerification:
        $ref: '#/definitions/models.MobileVerification'
      mobileVerified:
        type: boolean
      oauthClient:
        $ref: '#/definitions/models.OAuthClient'
      organizations:
        items:
          $ref: '#/definitions/models.Organization'
        type: array
      password:
        minLength: 8
        type: string
      profile:
        $ref: '#/definitions/models.Profile'
      roles:
        items:
          $ref: '#/definitions/models.Role'
        type: array
      status:
        $ref: '#/definitions/constants.UserStatus'
      username:
        type: string
    required:
    - password
    - username
    type: object
  protocol.AttestationFormat:
    enum:
    - packed
    - tpm
    - android-key
    - android-safetynet
    - fido-u2f
    - apple
    - compound
    - none
    type: string
    x-enum-varnames:
    - AttestationFormatPacked
    - AttestationFormatTPM
    - AttestationFormatAndroidKey
    - AttestationFormatAndroidSafetyNet
    - AttestationFormatFIDOUniversalSecondFactor
    - AttestationFormatApple
    - AttestationFormatCompound
    - AttestationFormatNone
  protocol.AuthenticationExtensions:
    properties:
      appid:
        description: AppID is the FIDO AppID Extension input. Authentication only.
        type: string
      appidExclude:
        description: AppIDExclude is the FIDO AppID Exclusion Extension input. Registration
          only.
        type: string
      credBlob:
        description: CredBlob is the blob to store with the credential. Registration
          only.
        items:
          type: integer
        type: array
      credProps:
        description: CredProps requests the Credential Properties Extension. Registration
          only.
        type: boolean
      credentialProtectionPolicy:
        allOf:
        - $ref: '#/definitions/protocol.CredentialProtectionPolicy'
        description: CredentialProtectionPolicy is the CTAP credProtect policy. Registration
          only.
      enforceCredentialProtectionPolicy:
        description: EnforceCredentialProtectionPolicy requires the credProtect policy
          is honoured. Registration only.
        type: boolean
      getCredBlob:
        description: GetCredBlob requests the blob stored with the credential. Authentication
          only.
        type: boolean
      hmacCreateSecret:
        description: HMACCreateSecret requests provisioning of the CTAP hmac-secret.
          Registration only.
        type: boolean
      hmacGetSecret:
        allOf:
        - $ref: '#/definitions/protocol.HMACGetSecretInputs'
        description: HMACGetSecret requests evaluation of the CTAP hmac-secret. Authentication
          only.
      largeBlob:
        allOf:
        - $ref: '#/definitions/protocol.LargeBlobInputs'
        description: LargeBlob is the Large blob storage Extension input.
      minPinLength:
        description: MinPinLength requests the authenticator minimum PIN length. Registration
          only.
        type: boolean
      prf:
        allOf:
        - $ref: '#/definitions/protocol.PRFInputs'
        description: |-
          PRF is the Pseudo-random function Extension input. It is a pointer because an empty dictionary is a
          meaningful input for this extension and only this extension: a Relying Party sends "prf":{} at registration
          to ask whether the pseudo-random function is available for the credential being created, and the client
          answers with the 'enabled' output. A value type combined with omitzero cannot express the difference between
          an absent member and a member present but empty, so a non-nil pointer to a zero value is what carries the
          bare availability probe.
      remoteClientDataJSON:
        description: |-
          RemoteClientDataJSON is the Remote Client Data JSON Extension input. This member is set by a remote desktop
          web client and a Relying Party should not normally set it. See [ExtensionRemoteClientDataJSON], which records
          that this extension is not yet ratified.
        type: string
      uvm:
        description: UVM requests the user verification methods used for the operation.
        type: boolean
    type: object
  protocol.AuthenticatorAttachment:
    enum:
    - platform
    - cross-platform
    type: string
    x-enum-varnames:
    - Platform
    - CrossPlatform
  protocol.AuthenticatorSelection:
    properties:
      authenticatorAttachment:
        allOf:
        - $ref: '#/definitions/protocol.AuthenticatorAttachment'
        description: |-
          AuthenticatorAttachment If this member is present, eligible authenticators are filtered to only
          authenticators attached with the specified AuthenticatorAttachment enum.
      requireResidentKey:
        description: |-
          RequireResidentKey this member describes the Relying Party's requirements regarding resident
          credentials. If the parameter is set to true, the authenticator MUST create a client-side-resident
          public key credential source when creating a public key credential.
        type: boolean
      residentKey:
        allOf:
        - $ref: '#/definitions/protocol.ResidentKeyRequirement'
        description: |-
          ResidentKey this member describes the Relying Party's requirements regarding resident
          credentials per Webauthn Level 2.
      userVerification:
        allOf:
        - $ref: '#/definitions/protocol.UserVerificationRequirement'
        description: |-
          UserVerification This member describes the Relying Party's requirements regarding user verification for
          the create() operation. Eligible authenticators are filtered to only those capable of satisfying this
          requirement.
    type: object
  protocol.AuthenticatorTransport:
    enum:
    - usb
    - nfc
    - ble
    - smart-card
    - hybrid
    - internal
    type: string
    x-enum-varnames:
    - USB
    - NFC
    - BLE
    - SmartCard
    - Hybrid
    - Internal
  protocol.ConveyancePreference:
    enum:
    - none
    - indirect
    - direct
    - enterprise
    type: string
    x-enum-varnames:
    - PreferNoAttestation
    - PreferIndirectAttestation
    - PreferDirectAttestation
    - PreferEnterpriseAttestation
  protocol.CredentialAssertion:
    properties:
      mediation:
        $ref: '#/definitions/protocol.CredentialMediationRequirement'
      publicKey:
        $ref: '#/definitions/protocol.PublicKeyCredentialRequestOptions'
    type: object
  protocol.CredentialCreation:
    properties:
      mediation:
        $ref: '#/definitions/protocol.CredentialMediationRequirement'
      publicKey:
        $ref: '#/definitions/protocol.PublicKeyCredentialCreationOptions'
    type: object
  protocol.CredentialDescriptor:
    properties:
      id:
        description: CredentialID The ID of a credential to allow/disallow.
        items:
          type: integer
        type: array
      transports:
        description: The authenticator transports that can be used.
        items:
          $ref: '#/definitions/protocol.AuthenticatorTransport'
        type: array
      type:
        allOf:
        - $ref: '#/definitions/protocol.CredentialType'
        description: The valid credential types.
    type: object
  protocol.CredentialMediationRequirement:
    enum:
    - ""
    - silent
    - optional
    - conditional
    - required
    type: string
    x-enum-varnames:
    - MediationDefault
    - MediationSilent
    - MediationOptional
    - MediationConditional
    - MediationRequired
  protocol.CredentialParameter:
    properties:
      alg:
        $ref: '#/definitions/webauthncose.COSEAlgorithmIdentifier'
      type:
        $ref: '#/definitions/protocol.CredentialType'
    type: object
  protocol.CredentialProtectionPolicy:
    enum:
    - userVerificationOptional
    - userVerificationOptionalWithCredentialIDList
    - userVerificationRequired
    type: string
    x-enum-varnames:
    - CredentialProtectionPolicyUserVerificationOptional
    - CredentialProtectionPolicyUserVerificationOptionalWithCredentialIDList
    - CredentialProtectionPolicyUserVerificationRequired
  protocol.CredentialType:
    enum:
    - public-key
    type: string
    x-enum-varnames:
    - PublicKeyCredentialType
  protocol.HMACGetSecretInputs:
    properties:
      salt1:
        items:
          type: integer
        type: array
      salt2:
        items:
          type: integer
        type: array
    type: object
  protocol.LargeBlobInputs:
    properties:
      read:
        type: boolean
      support:
        $ref: '#/definitions/protocol.LargeBlobSupport'
      write:
        items:
          type: integer
        type: array
    type: object
  protocol.LargeBlobSupport:
    enum:
    - required
    - preferred
    type: string
    x-enum-varnames:
    - LargeBlobSupportRequired
    - LargeBlobSupportPreferred
  protocol.PRFInputs:
    properties:
      eval:
        $ref: '#/definitions/protocol.PRFValues'
      evalByCredential:
        additionalProperties:
          $ref: '#/definitions/protocol.PRFValues'
        type: object
    type: object
  protocol.PRFValues:
    properties:
      first:
        items:
          type: integer
        type: array
      second:
        items:
          type: integer
        type: array
    type: object
  protocol.PublicKeyCredentialCreationOptions:
    properties:
      attestation:
        $ref: '#/definitions/protocol.ConveyancePreference'
      attestationFormats:
        items:
          $ref: '#/definitions/protocol.AttestationFormat'
        type: array
      authenticatorSelection:
        $ref: '#/definitions/protocol.AuthenticatorSelection'
      challenge:
        items:
          type: integer
        type: array
      excludeCredentials:
        items:
          $ref: '#/definitions/protocol.CredentialDescriptor'
        type: array
      extensions:
        $ref: '#/definitions/protocol.AuthenticationExtensions'
      hints:
        items:
          $ref: '#/definitions/protocol.PublicKeyCredentialHints'
        type: array
      pubKeyCredParams:
        items:
          $ref: '#/definitions/protocol.CredentialParameter'
        type: array
      rp:
        $ref: '#/definitions/protocol.RelyingPartyEntity'
      timeout:
        type: integer
      user:
        $ref: '#/definitions/protocol.UserEntity'
    type: object
  protocol.PublicKeyCredentialHints:
    enum:
    - security-key
    - client-device
    - hybrid
    type: string
    x-enum-varnames:
    - PublicKeyCredentialHintSecurityKey
    - PublicKeyCredentialHintClientDevice
    - PublicKeyCredentialHintHybrid
  protocol.PublicKeyCredentialRequestOptions:
    properties:
      allowCredentials:
        items:
          $ref: '#/definitions/protocol.CredentialDescriptor'
        type: array
      challenge:
        items:
          type: integer
        type: array
      extensions:
        $ref: '#/definitions/protocol.AuthenticationExtensions'
      hints:
        items:
          $ref: '#/definitions/protocol.PublicKeyCredentialHints'
        type: array
      rpId:
        type: string
      timeout:
        type: integer
      userVerification:
        $ref: '#/definitions/protocol.UserVerificationRequirement'
    type: object
  protocol.RelyingPartyEntity:
    properties:
      id:
        description: A unique identifier for the Relying Party entity, which sets
          the RP ID.
        type: string
      name:
        description: |-
          A human-palatable name for the entity. Its function depends on what the PublicKeyCredentialEntity represents:

          When inherited by PublicKeyCredentialRpEntity it is a human-palatable identifier for the Relying Party,
          intended only for display. For example, "ACME Corporation", "Wonderful Widgets, Inc." or "ОАО Примертех".

          When inherited by PublicKeyCredentialUserEntity, it is a human-palatable identifier for a user account. It is
          intended only for display, i.e., aiding the user in determining the difference between user accounts with similar
          displayNames. For example, "alexm", "alex.p.mueller@example.com" or "+14255551234".
        type: string
    type: object
  protocol.ResidentKeyRequirement:
    enum:
    - discouraged
    - preferred
    - required
    type: string
    x-enum-varnames:
    - ResidentKeyRequirementDiscouraged
    - ResidentKeyRequirementPreferred
    - ResidentKeyRequirementRequired
  protocol.UserEntity:
    properties:
      displayName:
        description: |-
          A human-palatable name for the user account, intended only for display.
          For example, "Alex P. Müller" or "田中 倫". The Relying Party SHOULD let
          the user choose this, and SHOULD NOT restrict the choice more than necessary.
        type: string
      id:
        description: |-
          ID is the user handle of the user account entity. To ensure secure operation,
          authentication and authorization decisions MUST be made on the basis of this id
          member, not the displayName nor name members. See Section 6.1 of
          [RFC8266](https://www.w3.org/TR/webauthn/#biblio-rfc8266).
      name:
        description: |-
          A human-palatable name for the entity. Its function depends on what the PublicKeyCredentialEntity represents:

          When inherited by PublicKeyCredentialRpEntity it is a human-palatable identifier for the Relying Party,
          intended only for display. For example, "ACME Corporation", "Wonderful Widgets, Inc." or "ОАО Примертех".

          When inherited by PublicKeyCredentialUserEntity, it is a human-palatable identifier for a user account. It is
          intended only for display, i.e., aiding the user in determining the difference between user accounts with similar
          displayNames. For example, "alexm", "alex.p.mueller@example.com" or "+14255551234".
        type: string
    type: object
  protocol.UserVerificationRequirement:
    enum:
    - required
    - preferred
    - discouraged
    type: string
    x-enum-comments:
      VerificationPreferred: This is the default.
    x-enum-descriptions:
    - ""
    - This is the default.
    - ""
    x-enum-varnames:
    - VerificationRequired
    - VerificationPreferred
    - VerificationDiscouraged
  subscriptions.Amount:
    properties:
      additional_unit_amount:
        description: |-
          AdditionalUnitAmount is what each licence beyond the first costs. Equal to
          FirstUnitAmount on a flat per-unit price.
        type: integer
      currency:
        type: string
      first_unit_amount:
        description: |-
          FirstUnitAmount is what the first licence costs. For a graduated price
          this is tier one; for a flat price it is the unit amount.
        type: integer
      tiered:
        description: |-
          Tiered reports whether the price uses graduated tiers, so a pricing page
          knows whether to show "from X" plus a per-seat line.
        type: boolean
    type: object
  subscriptions.Entitlements:
    properties:
      cancel_at_period_end:
        description: CancelAtPeriodEnd is true when any active line is set to lapse.
        type: boolean
      current_period_end:
        type: string
      current_period_start:
        description: |-
          CurrentPeriodStart and CurrentPeriodEnd bound the earliest-renewing active
          line's billing period.
        type: string
      ended_at:
        description: |-
          EndedAt is when access ended. Set only for the canceled and expired
          states.
        type: string
      entitled:
        description: Entitled reports whether the organization may use the application.
        type: boolean
      features:
        description: Features is the union of features granted by all active lines.
        items:
          type: string
        type: array
      licenses:
        description: Licenses is the total number of members the plan allows.
        type: integer
      licenses_available:
        description: LicensesAvailable is Licenses-LicensesUsed, floored at zero.
        type: integer
      licenses_used:
        description: |-
          LicensesUsed counts current members plus, when configured, unexpired
          pending invitations.
        type: integer
      limits:
        additionalProperties:
          $ref: '#/definitions/subscriptions.LimitGrant'
        description: |-
          Limits is every cap and monthly quota the active lines grant, keyed by
          limit key. A key absent here is not offered on the current plan.
        type: object
      managed_externally:
        description: |-
          ManagedExternally is false when subscriptions are disabled, telling the
          frontend to hide billing UI entirely.
        type: boolean
      org_id:
        type: string
      over_limit:
        description: |-
          OverLimit is true when more licences are consumed than the plan allows,
          which happens after a downgrade. Existing members keep working; adding
          more is blocked.
        type: boolean
      plans:
        description: Plans describes each active line for display.
        items:
          $ref: '#/definitions/subscriptions.PlanSummary'
        type: array
      resolved_at:
        description: |-
          ResolvedAt is when this snapshot was computed, so a caller holding a
          cached copy can judge its age.
        type: string
      state:
        allOf:
        - $ref: '#/definitions/subscriptions.State'
        description: |-
          State is the provider-neutral lifecycle state. Branch on this rather than
          Status.
      status:
        description: |-
          Status is the provider's raw status for the most relevant line
          ("active", "trialing", "past_due", "canceled", ...), or "none" when the
          organization has never held a subscription. Kept for display.
        type: string
      trial_ends_at:
        description: |-
          TrialEndsAt is when the current trial converts to paid. Set only while
          trialing.
        type: string
    type: object
  subscriptions.Invoice:
    properties:
      amount_paid:
        type: integer
      created:
        type: string
      currency:
        type: string
      hosted_url:
        description: HostedURL is the provider-hosted invoice page.
        type: string
      id:
        type: string
      number:
        type: string
      pdf_url:
        description: PDFURL downloads the invoice.
        type: string
      period_end:
        type: string
      period_start:
        type: string
      status:
        description: 'Status is the provider''s raw status: paid, open, draft, void,
          uncollectible.'
        type: string
      total:
        description: Total and AmountPaid are in the currency's smallest unit.
        type: integer
    type: object
  subscriptions.LimitGrant:
    properties:
      kind:
        $ref: '#/definitions/subscriptions.LimitKind'
      limit:
        description: Limit is the allowance, or Unlimited.
        type: integer
      period_end:
        type: string
      period_start:
        description: |-
          PeriodStart and PeriodEnd bound the window a monthly quota is counted
          over, as [start, end). They are unset for caps.
        type: string
    type: object
  subscriptions.LimitKind:
    enum:
    - cap
    - monthly_quota
    type: string
    x-enum-varnames:
    - LimitKindCap
    - LimitKindMonthlyQuota
  subscriptions.PlanSummary:
    properties:
      cancel_at_period_end:
        type: boolean
      current_period_end:
        type: string
      licenses:
        type: integer
      name:
        type: string
      price_id:
        type: string
      quantity:
        type: integer
      status:
        type: string
      tier:
        type: string
    type: object
  subscriptions.PriceDetail:
    properties:
      amounts:
        additionalProperties:
          $ref: '#/definitions/subscriptions.Amount'
        description: Amounts is keyed by lower-case ISO-4217 code.
        type: object
      default_currency:
        description: DefaultCurrency is what the provider charges when none is requested.
        type: string
      interval:
        description: Interval is "month" or "year".
        type: string
      price_id:
        type: string
    type: object
  subscriptions.RedirectSession:
    properties:
      id:
        description: ID is the provider's session identifier, useful for logging.
        type: string
      url:
        description: URL is the destination the frontend must redirect to.
        type: string
    type: object
  subscriptions.State:
    enum:
    - not_managed
    - none
    - trialing
    - active
    - past_due
    - canceled
    - expired
    type: string
    x-enum-varnames:
    - StateNotManaged
    - StateNone
    - StateTrialing
    - StateActive
    - StatePastDue
    - StateCanceled
    - StateExpired
  types.AuthorizeResponse:
    properties:
      status:
        type: boolean
    type: object
  types.CheckPermissionBody:
    properties:
      action:
        type: string
      orgID:
        type: integer
      resource:
        type: string
      scope:
        type: string
    type: object
  types.CreatePermissionBody:
    properties:
      action:
        minLength: 3
        type: string
      resource:
        minLength: 3
        type: string
      scope:
        minLength: 3
        type: string
    required:
    - action
    - resource
    - scope
    type: object
  types.ListRolePermission:
    properties:
      action:
        type: string
      isHidden:
        type: boolean
      isLocked:
        type: boolean
      resource:
        type: string
      scope:
        type: string
    type: object
  types.ListRoleResponse:
    properties:
      description:
        type: string
      extraAttrs:
        additionalProperties: true
        type: object
      id:
        type: string
      name:
        type: string
      userCount:
        type: integer
    type: object
  types.ListRolesPagedResponse:
    properties:
      page:
        type: integer
      roles:
        items:
          $ref: '#/definitions/types.ListRoleResponse'
        type: array
      size:
        type: integer
      total:
        type: integer
    type: object
  types.ListUserResponse:
    properties:
      activeSessions:
        type: integer
      email:
        type: string
      firstName:
        type: string
      id:
        type: string
      lastLogin:
        type: string
      lastName:
        type: string
      roles:
        items:
          $ref: '#/definitions/types.RoleWithId'
        type: array
      status:
        $ref: '#/definitions/constants.UserStatus'
      username:
        type: string
    type: object
  types.ResendEmailVerificationRequestBody:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  types.RolePermissionBindingBody:
    properties:
      action:
        type: string
      resource:
        type: string
      role_id:
        type: string
      scope:
        type: string
    type: object
  types.RoleWithId:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  types.SignupRequestBody:
    properties:
      email:
        type: string
      firstName:
        type: string
      lastName:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - firstName
    - lastName
    - password
    type: object
  types.SimpleResponse:
    properties:
      message:
        example: message
        type: string
    type: object
  types.UserInfoOrganization:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  types.UserInfoProfile:
    properties:
      avatar:
        type: string
      bio:
        type: string
      country:
        type: string
      designation:
        type: string
      email:
        type: string
      firstName:
        type: string
      lastName:
        type: string
      phone:
        type: string
      timezone:
        type: string
    type: object
  types.UserInfoRole:
    properties:
      description:
        type: string
      extraAttrs:
        additionalProperties: true
        type: object
      name:
        type: string
    required:
    - name
    type: object
  types.UserRoleBindingBody:
    properties:
      orgId:
        type: string
      roleId:
        type: string
      userId:
        type: string
    required:
    - orgId
    - roleId
    - userId
    type: object
  types.VerifyEmailRequestBody:
    properties:
      code:
        type: string
      email:
        type: string
    required:
    - code
    - email
    type: object
  webauthncose.COSEAlgorithmIdentifier:
    enum:
    - -7
    - -8
    - -9
    - -19
    - -35
    - -36
    - -37
    - -38
    - -39
    - -47
    - -51
    - -52
    - -257
    - -258
    - -259
    - -65535
    type: integer
    x-enum-varnames:
    - AlgES256
    - AlgEdDSA
    - AlgESP256
    - AlgEd25519
    - AlgES384
    - AlgES512
    - AlgPS256
    - AlgPS384
    - AlgPS512
    - AlgES256K
    - AlgESP384
    - AlgESP512
    - AlgRS256
    - AlgRS384
    - AlgRS512
    - AlgRS1
host: localhost:8000
info:
  contact:
    email: jamsheed@nsmail.dev
    name: Jamsheed
    url: http://www.swagger.io/support
  description: This is REST api definitions.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: BigBucks Solutions Auth Engine
  version: 0.0.1
paths:
  /billing/catalog:
    get:
      description: Returns the configured plan catalog keyed by provider price id.
        An empty object means billing is disabled for this deployment.
      parameters:
      - description: Authorization
        in: header
        name: X-Auth
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema: {}
      security:
      - JWTAuth: []
      summary: List purchasable plans
      tags:
      - billing
  /billing/checkout-session:
    post:
      consumes:
      - application/json
      description: Creates a provider-hosted checkout session and returns the URL
        the browser must be redirected to. The organization becomes the billing customer;
        the owner's email receives receipts.
      parameters:
      - description: Authorization
        in: header
        name: X-Auth
        required: true
        type: string
      - description: Organization ID
        in: header
        name: X-Organization-Id
        required: true
        type: string
      - description: Checkout options
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controllers.checkoutRequestBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/subscriptions.RedirectSession'
        "400":
          description: Bad Request
          schema: {}
        "401":
          description: Unauthorized
          schema: {}
        "403":
          description: X-Organization-Id is missing, or the caller lacks billing:*:write
            in that organization
          schema: {}
        "409":
          description: The organization already has a subscription; change it through
            the billing portal
          schema: {}
        "501":
          description: Not Implemented
          schema: {}
      security:
      - JWTAuth: []
      summary: Start a subscription purchase
      tags:
      - billing
  /billing/invoices:
    get:
      description: Returns the organization's billing history, newest first, for rendering
        in your own UI. Drafts are excluded. Each entry carries a hosted page and
        a PDF link. An organization that has never purchased returns an empty list.
      parameters:
      - description: Authorization
        in: header
        name: X-Auth
        required: true
        type: string
      - description: Organization ID
        in: header
        name: X-Organization-Id
        required: true
        type: string
      - description: Maximum invoices to return (default 12, max 100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/subscriptions.Invoice'
            type: array
        "401":
          description: Unauthorized
          schema: {}
        "403":
          description: Forbidden
          schema: {}
        "501":
          description: Not Implemented
          schema: {}
      security:
      - JWTAuth: []
      summary: List past invoices
      tags:
      - billing
  /billing/plans:
    get:
      description: 'Returns everything a pricing or upgrade screen needs: every feature
        and limit in the catalog as comparison rows, one plan per tier with the features
        and limits it includes, the effective trial duration, and live amounts read
        from the billing provider. `available: false` means billing is disabled and
        the page should not be rendered.'
      parameters:
      - description: Authorization
        in: header
        name: X-Auth
        required: true
        type: string
      - description: Organization being quoted; applies its currency lock and trial
          eligibility
        in: header
        name: X-Organization-Id
        type: string
      - description: Organization ISO-3166 alpha-2 country code
        in: query
        name: country
        type: string
      - description: Explicit ISO-4217 currency override
        in: query
        name: currency
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/actions.PricingPage'
        "401":
          description: Unauthorized
          schema: {}
        "403":
          description: Caller is not a member of X-Organization-Id
          schema: {}
      security:
      - JWTAuth: []
      summary: Get the pricing page
      tags:
      - billing
  /billing/portal-session:
    post:
      consumes:
      - application/json
      description: Creates a provider-hosted portal session where an administrator
        can change licence counts, switch plan, update payment details, download invoices
        and cancel. Pass `flow` to deep-link straight to one of those tasks. Licence
        changes made there are prorated by the provider and arrive back over webhook.
      parameters:
      - description: Authorization
        in: header
        name: X-Auth
        required: true
        type: string
      - description: Organization ID
        in: header
        name: X-Organization-Id
        required: true
        type: string
      - description: Portal options
        in: body
        name: body
        schema:
          $ref: '#/definitions/controllers.portalRequestBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/subscriptions.RedirectSession'
        "401":
          description: Unauthorized
          schema: {}
        "409":
          description: Conflict
          schema: {}
        "501":
          description: Not Implemented
          schema: {}
      security:
      - JWTAuth: []
      summary: Open the billing management portal
      tags:
      - billing
  /billing/subscription:
    get:
      description: 'Returns entitlement state: whether the organization may use the
        app, its provider-neutral lifecycle state (none, trialing, active, past_due,
        canceled, expired, not_managed), how many licences the plan allows and how
        many are consumed, which features are unlocked, and the caps and monthly quotas
        the plan grants. When billing is disabled, managed_externally is false and
        the frontend should hide billing UI.'
      parameters:
      - description: Authorization
        in: header
        name: X-Auth
        required: true
        type: string
      - description: Organization ID
        in: header
        name: X-Organization-Id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/subscriptions.Entitlements'
        "401":
          description: Unauthorized
          schema: {}
        "403":
          description: X-Organization-Id is missing, or the caller is not a member
            of that organization
          schema: {}
      security:
      - JWTAuth: []
      summary: Get the current organization's subscription
      tags:
      - billing
  /email-verifications/resend:
    post:
      consumes:
      - application/json
      description: Returns a generic response for unknown and already-verified accounts.
      parameters:
      - description: Account email
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/types.ResendEmailVerificationRequestBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.SimpleResponse'
        "400":
          description: Invalid request
          schema: {}
        "429":
          description: Send limit or cooldown reached
          schema: {}
        "503":
          description: Email delivery unavailable
          schema: {}
      summary: Resend a signup email verification code
      tags:
      - auth
  /email-verifications/verify:
    post:
      consumes:
      - application/json
      description: Consumes a six-digit email verification code. Verification does
        not create a session.
      parameters:
      - description: Email and verification code
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/types.VerifyEmailRequestBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.SimpleResponse'
        "400":
          description: Invalid request or code
          schema: {}
        "403":
          description: Expired, consumed, or locked code
          schema: {}
      summary: Verify a signup email
      tags:
      - auth
  /invitations:
    get:
      consumes:
      - application/json
      description: Get paginated list of invitations for the current organization
        with sorting support
      parameters:
      - description: Authorization
        in: header
        name: X-Auth
        required: true
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Page size
        in: query
        name: page_size
        type: integer
      - description: Filter by status (pending, accepted, expired, revoked)
        in: query
        name: status
        type: string
      - default: created_at
        description: Order by field (email, status, created_at, expires_at, role_name,
          inviter_name)
        in: query
        name: order_by
        type: string
      - default: desc
        description: Order direction (asc, desc)
        in: query
        name: order_dir
        type: string
      - description: Search term to filter by inviter or invitee email
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.ListInvitationsResponse'
        "400":
          description: Bad request
          schema: {}
        "401":
          description: Unauthorized
          schema: {}
        "500":
          description: Internal server error
          schema: {}
      summary: List invitations for organization
      tags:
      - invitations
    post:
      consumes:
      - application/json
      description: Send an invitation to a user to join the organization with a specific
        role
      parameters:
      - description: Authorization
        in: header
        name: X-Auth
        required: true
        type: string
      - description: Invitation details
        in: body
        name: invitation
        required: true
        schema:
          $ref: '#/definitions/controllers.InviteUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Invitation sent successfully
          schema:
            $ref: '#/definitions/controllers.InvitationResponse'
        "400":
          description: Bad request
          schema: {}
        "401":
          description: Unauthorized
          schema: {}
        "500":
          description: Internal server error
          schema: {}
      summary: Invite user to organization
      tags:
      - invitations
  /invitations/{invitation_id}/resend:
    post:
      consumes:
      - application/json
      description: Resend an existing invitation or create a new one if expired
      parameters:
      - description: Authorization
        in: header
        name: X-Auth
        required: true
        type: string
      - description: Invitation ID
        in: path
        name: invitation_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Invitation resent
          schema:
            $ref: '#/definitions/controllers.InvitationResponse'
        "400":
          description: Bad request
          schema: {}
        "404":
          description: Not found
          schema: {}
        "500":
          description: Internal server error
          schema: {}
      summary: Resend invitation
      tags:
      - invitations
  /invitations/{invitation_id}/revoke:
    put:
      consumes:
      - application/json
      description: Revoke a pending invitation
      parameters:
      - description: Authorization
        in: header
        name: X-Auth
        required: true
        type: string
      - description: Invitation ID
        in: path
        name: invitation_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Invitation revoked successfully
          schema:
            $ref: '#/definitions/types.SimpleResponse'
        "400":
          description: Bad request
          schema: {}
        "401":
          description: Unauthorized
          schema: {}
        "404":
          description: Invitation not found
          schema: {}
        "500":
          description: Internal server error
          schema: {}
      summary: Revoke invitation
      tags:
      - invitations
  /invitations/accept:
    get:
      consumes:
      - application/json
      description: Accept an invitation to join an organization
      parameters:
      - description: Authorization
        in: header
        name: X-Auth
        required: true
        type: string
      - description: Invitation Token
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Invitation accepted successfully
          schema:
            $ref: '#/definitions/controllers.AcceptInvitationResponse'
        "400":
          description: Bad request
          schema: {}
        "401":
          description: Unauthorized
          schema: {}
        "409":
          description: Conflict - Invitation already accepted
          schema: {}
        "500":
          description: Internal server error
          schema: {}
      summary: Accept invitation
      tags:
      - invitations
  /master-data/actions:
    get:
      consumes:
      - application/json
      parameters:
      - description: Authorization
        in: header
        name: X-Auth
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
      summary: Get actions
      tags:
      - permissions
  /master-data/resources:
    get:
      consumes:
      - application/json
      parameters:
      - description: Authorization
        in: header
