      - application/json
      responses:
        "200":
          description: has_credentials
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: Bad request
          schema: {}
      summary: Check if user has WebAuthn credentials
      tags:
      - webauthn
