      - application/json
      responses:
        "200":
          description: List of credentials
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
        "401":
          description: Unauthorized
          schema: {}
        "500":
          description: Internal server error
          schema: {}
      security:
      - JWTAuth: []
      summary: List WebAuthn credentials
      tags:
      - webauthn
