          maxLength: 500
          type: string
        email:
          type: string
        latitude:
          type: number
        logo_url:
          type: string
        longitude:
          type: number
        name:
          minLength: 4
          type: string
        phone:
          minLength: 5
          type: string
        postal_code:
          type: string
        state:
          type: string
        tax_id:
          type: string
        website:
          type: string
      required:
      - email
      - name
      type: object
    actions.PricingFeature:
      example:
        description: description
        label: label
        key: key
      properties:
        description:
          type: string
        key:
          type: string
        label:
          type: string
      type: object
    actions.PricingLimit:
      example:
        period: period
        unit: unit
        label: label
        key: key
      properties:
        key:
          type: string
        label:
          type: string
        period:
          description: "Period is \"month\" for allowances that reset, \"total\" for\
            \ standing caps."
          type: string
        unit:
          type: string
      type: object
    actions.PricingPage:
      example:
        features:
        - description: description
          label: label
          key: key
        - description: description
          label: label
          key: key
        plans:
        - features:
          - features
          - features
          highlight: true
          tier: tier
          name: name
          description: description
          limits:
            key: 0
          pricing:
            key:
              amounts:
                key:
                  tiered: true
                  first_unit_amount: 1
                  currency: currency
                  additional_unit_amount: 6
              price_id: price_id
              interval: interval
              default_currency: default_currency
        - features:
          - features
          - features
          highlight: true
          tier: tier
          name: name
          description: description
          limits:
            key: 0
          pricing:
            key:
              amounts:
                key:
                  tiered: true
                  first_unit_amount: 1
                  currency: currency
                  additional_unit_amount: 6
              price_id: price_id
              interval: interval
              default_currency: default_currency
        available: true
        currency_locked: true
        currency: currency
        trial_period_days: 5
        limits:
        - period: period
          unit: unit
          label: label
          key: key
        - period: period
          unit: unit
          label: label
          key: key
        currencies:
        - currencies
        - currencies
      properties:
        available:
          description: |-
            Available is false when billing is disabled for this deployment, in which
            case the pricing page should not be rendered at all.
          type: boolean
        currencies:
          description: |-
            Currencies is every code the organization may actually buy in, sorted. A
            currency offered by only some plans is excluded, since a switcher that
            blanks one column is worse than not offering it.
          items:
            type: string
          type: array
        currency:
          description: |-
            Currency is the ISO-4217 code the page should display by default,
            resolved from the organization's country unless explicitly requested.
          type: string
        currency_locked:
          description: |-
            CurrencyLocked is true once the organization has billed and the provider
            has pinned it to a single currency. Currencies then holds only that one
            and the frontend should hide the switcher rather than offer a choice that
            would fail at checkout.
          type: boolean
        features:
          description: "Features is every capability in the catalog, ordered for display."
          items:
            $ref: '#/components/schemas/actions.PricingFeature'
          type: array
        limits:
          description: "Limits is every quota and cap in the catalog, ordered for\
            \ display."
          items:
            $ref: '#/components/schemas/actions.PricingLimit'
          type: array
        plans:
          description: "Plans is one entry per tier, cheapest first."
          items:
            $ref: '#/components/schemas/actions.PricingPlan'
          type: array
        trial_period_days:
          description: |-
            TrialPeriodDays is the trial Checkout grants to a new subscription. Zero
            means no trial is available.
          type: integer
      type: object
    actions.PricingPlan:
      example:
        features:
        - features
        - features
        highlight: true
        tier: tier
        name: name
        description: description
        limits:
          key: 0
        pricing:
          key:
            amounts:
              key:
                tiered: true
                first_unit_amount: 1
                currency: currency
                additional_unit_amount: 6
            price_id: price_id
            interval: interval
            default_currency: default_currency
      properties:
        description:
          type: string
        features:
          description: |-
            Features lists the capability keys this tier includes. Keys absent from
            this list but present in PricingPage.Features are not included.
          items:
            type: string
          type: array
        highlight:
          type: boolean
        limits:
          additionalProperties:
            format: int64
            type: integer
          description: |-
            Limits maps a limit key to its value for this tier. -1 means unlimited.
            A key missing here is not offered at all on this tier.
          type: object
        name:
          type: string
        pricing:
          additionalProperties:
            $ref: '#/components/schemas/subscriptions.PriceDetail'
          description: "Pricing is keyed by billing interval, \"month\" and/or \"\
            year\"."
          type: object
