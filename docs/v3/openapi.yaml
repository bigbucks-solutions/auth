openapi: 3.0.1
info:
  contact:
    email: jamsheed@nsmail.dev
    name: Jamsheed
    url: http://www.swagger.io/support
  description: This is REST api definitions.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: BigBucks Solutions Auth Engine
  version: 0.0.1
servers:
- url: //localhost:8000/api/v1
paths:
  /billing/catalog:
    get:
      description: Returns the configured plan catalog keyed by provider price id.
        An empty object means billing is disabled for this deployment.
      parameters:
      - description: Authorization
        in: header
        name: X-Auth
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
          description: OK
        "401":
          content:
            application/json:
              schema:
                type: object
          description: Unauthorized
      security:
      - JWTAuth: []
      summary: List purchasable plans
      tags:
      - billing
  /billing/checkout-session:
    post:
      description: Creates a provider-hosted checkout session and returns the URL
        the browser must be redirected to. The organization becomes the billing customer;
        the owner's email receives receipts.
      parameters:
      - description: Authorization
        in: header
        name: X-Auth
        required: true
        schema:
          type: string
      - description: Organization ID
        in: header
        name: X-Organization-Id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/controllers.checkoutRequestBody'
        description: Checkout options
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/subscriptions.RedirectSession'
          description: OK
        "400":
          content:
            application/json:
              schema:
                type: object
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                type: object
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                type: object
          description: "X-Organization-Id is missing, or the caller lacks billing:*:write\
            \ in that organization"
        "409":
          content:
            application/json:
              schema:
                type: object
          description: The organization already has a subscription; change it through
            the billing portal
        "501":
          content:
            application/json:
              schema:
                type: object
          description: Not Implemented
      security:
      - JWTAuth: []
      summary: Start a subscription purchase
      tags:
      - billing
      x-codegen-request-body-name: body
  /billing/invoices:
    get:
      description: "Returns the organization's billing history, newest first, for\
        \ rendering in your own UI. Drafts are excluded. Each entry carries a hosted\
        \ page and a PDF link. An organization that has never purchased returns an\
        \ empty list."
      parameters:
      - description: Authorization
        in: header
        name: X-Auth
        required: true
        schema:
          type: string
      - description: Organization ID
        in: header
        name: X-Organization-Id
        required: true
        schema:
          type: string
      - description: "Maximum invoices to return (default 12, max 100)"
        in: query
        name: limit
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/subscriptions.Invoice'
                type: array
          description: OK
        "401":
          content:
            application/json:
              schema:
                type: object
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                type: object
          description: Forbidden
        "501":
          content:
            application/json:
              schema:
                type: object
          description: Not Implemented
      security:
      - JWTAuth: []
      summary: List past invoices
      tags:
      - billing
  /billing/plans:
    get:
      description: "Returns everything a pricing or upgrade screen needs: every feature\
        \ and limit in the catalog as comparison rows, one plan per tier with the\
        \ features and limits it includes, the effective trial duration, and live\
        \ amounts read from the billing provider. `available: false` means billing\
        \ is disabled and the page should not be rendered."
      parameters:
      - description: Authorization
        in: header
        name: X-Auth
        required: true
        schema:
          type: string
      - description: Organization being quoted; applies its currency lock and trial
          eligibility
        in: header
        name: X-Organization-Id
        schema:
          type: string
      - description: Organization ISO-3166 alpha-2 country code
        in: query
        name: country
        schema:
          type: string
      - description: Explicit ISO-4217 currency override
        in: query
        name: currency
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/actions.PricingPage'
          description: OK
        "401":
          content:
            application/json:
              schema:
                type: object
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                type: object
          description: Caller is not a member of X-Organization-Id
      security:
      - JWTAuth: []
      summary: Get the pricing page
      tags:
      - billing
  /billing/portal-session:
    post:
      description: "Creates a provider-hosted portal session where an administrator\
        \ can change licence counts, switch plan, update payment details, download\
        \ invoices and cancel. Pass `flow` to deep-link straight to one of those tasks.\
        \ Licence changes made there are prorated by the provider and arrive back\
        \ over webhook."
      parameters:
      - description: Authorization
        in: header
        name: X-Auth
        required: true
        schema:
          type: string
      - description: Organization ID
        in: header
        name: X-Organization-Id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/controllers.portalRequestBody'
        description: Portal options
        required: false
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/subscriptions.RedirectSession'
          description: OK
        "401":
          content:
            application/json:
              schema:
                type: object
          description: Unauthorized
        "409":
          content:
            application/json:
              schema:
                type: object
          description: Conflict
        "501":
          content:
            application/json:
              schema:
                type: object
          description: Not Implemented
      security:
      - JWTAuth: []
      summary: Open the billing management portal
      tags:
      - billing
      x-codegen-request-body-name: body
  /billing/subscription:
    get:
      description: "Returns entitlement state: whether the organization may use the\
        \ app, its provider-neutral lifecycle state (none, trialing, active, past_due,\
        \ canceled, expired, not_managed), how many licences the plan allows and how\
        \ many are consumed, which features are unlocked, and the caps and monthly\
        \ quotas the plan grants. When billing is disabled, managed_externally is\
        \ false and the frontend should hide billing UI."
      parameters:
      - description: Authorization
        in: header
        name: X-Auth
        required: true
        schema:
          type: string
      - description: Organization ID
        in: header
        name: X-Organization-Id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/subscriptions.Entitlements'
          description: OK
        "401":
          content:
            application/json:
              schema:
                type: object
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                type: object
          description: "X-Organization-Id is missing, or the caller is not a member\
            \ of that organization"
      security:
      - JWTAuth: []
      summary: Get the current organization's subscription
      tags:
      - billing
  /email-verifications/resend:
    post:
      description: Returns a generic response for unknown and already-verified accounts.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/types.ResendEmailVerificationRequestBody'
        description: Account email
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/types.SimpleResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                type: object
          description: Invalid request
        "429":
          content:
            application/json:
              schema:
                type: object
          description: Send limit or cooldown reached
        "503":
          content:
            application/json:
              schema:
                type: object
          description: Email delivery unavailable
      summary: Resend a signup email verification code
      tags:
      - auth
      x-codegen-request-body-name: request
  /email-verifications/verify:
    post:
      description: Consumes a six-digit email verification code. Verification does
        not create a session.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/types.VerifyEmailRequestBody'
        description: Email and verification code
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/types.SimpleResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                type: object
          description: Invalid request or code
        "403":
          content:
            application/json:
              schema:
                type: object
          description: "Expired, consumed, or locked code"
      summary: Verify a signup email
      tags:
      - auth
      x-codegen-request-body-name: request
  /invitations:
    get:
      description: Get paginated list of invitations for the current organization
        with sorting support
      parameters:
      - description: Authorization
        in: header
        name: X-Auth
        required: true
        schema:
          type: string
      - description: Page number
        in: query
        name: page
        schema:
          default: 1
          type: integer
      - description: Page size
        in: query
        name: page_size
        schema:
          default: 10
          type: integer
      - description: "Filter by status (pending, accepted, expired, revoked)"
        in: query
        name: status
        schema:
          type: string
      - description: "Order by field (email, status, created_at, expires_at, role_name,\
          \ inviter_name)"
        in: query
        name: order_by
        schema:
          default: created_at
          type: string
      - description: "Order direction (asc, desc)"
        in: query
        name: order_dir
        schema:
          default: desc
          type: string
      - description: Search term to filter by inviter or invitee email
        in: query
        name: search
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/controllers.ListInvitationsResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                type: object
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                type: object
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                type: object
          description: Internal server error
      summary: List invitations for organization
      tags:
      - invitations
    post:
      description: Send an invitation to a user to join the organization with a specific
        role
      parameters:
      - description: Authorization
        in: header
        name: X-Auth
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/controllers.InviteUserRequest'
        description: Invitation details
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/controllers.InvitationResponse'
          description: Invitation sent successfully
        "400":
          content:
            application/json:
              schema:
                type: object
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                type: object
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                type: object
          description: Internal server error
      summary: Invite user to organization
      tags:
      - invitations
      x-codegen-request-body-name: invitation
  /invitations/{invitation_id}/resend:
    post:
      description: Resend an existing invitation or create a new one if expired
      parameters:
      - description: Authorization
        in: header
        name: X-Auth
        required: true
        schema:
          type: string
      - description: Invitation ID
        in: path
        name: invitation_id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/controllers.InvitationResponse'
          description: Invitation resent
        "400":
          content:
            application/json:
              schema:
                type: object
          description: Bad request
        "404":
          content:
            application/json:
              schema:
                type: object
          description: Not found
        "500":
          content:
            application/json:
              schema:
                type: object
          description: Internal server error
      summary: Resend invitation
      tags:
      - invitations
  /invitations/{invitation_id}/revoke:
    put:
      description: Revoke a pending invitation
      parameters:
      - description: Authorization
        in: header
        name: X-Auth
        required: true
        schema:
          type: string
      - description: Invitation ID
        in: path
        name: invitation_id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/types.SimpleResponse'
          description: Invitation revoked successfully
        "400":
          content:
            application/json:
              schema:
                type: object
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                type: object
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                type: object
          description: Invitation not found
        "500":
          content:
            application/json:
              schema:
                type: object
          description: Internal server error
      summary: Revoke invitation
      tags:
      - invitations
  /invitations/accept:
    get:
      description: Accept an invitation to join an organization
      parameters:
      - description: Authorization
        in: header
        name: X-Auth
        required: true
        schema:
          type: string
      - description: Invitation Token
        in: query
        name: token
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/controllers.AcceptInvitationResponse'
          description: Invitation accepted successfully
        "400":
          content:
            application/json:
              schema:
                type: object
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                type: object
          description: Unauthorized
        "409":
          content:
            application/json:
              schema:
                type: object
          description: Conflict - Invitation already accepted
        "500":
          content:
            application/json:
              schema:
                type: object
          description: Internal server error
      summary: Accept invitation
      tags:
      - invitations
  /master-data/actions:
    get:
      parameters:
      - description: Authorization
        in: header
        name: X-Auth
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  type: string
                type: array
          description: OK
      summary: Get actions
      tags:
      - permissions
  /master-data/resources:
    get:
      parameters:
      - description: Authorization
        in: header
        name: X-Auth
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  type: string
                type: array
          description: OK
      summary: Get resources
      tags:
      - permissions
  /master-data/scopes:
    get:
      parameters:
      - description: Authorization
        in: header
        name: X-Auth
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  type: string
                type: array
          description: OK
      summary: Get scopes
      tags:
      - permissions
  /me:
    get:
      parameters:
      - description: Authorization
        in: header
        name: X-Auth
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bigbucks_solution_auth_rest-api_controllers_types.UserInfo'
          description: User details
        "400":
          content: {}
          description: ""
        "500":
          content: {}
          description: ""
      summary: Get logged in user profile information
      tags:
      - auth
  /organizations:
    post:
      description: "Create a new organization. Accepts either application/json with\
        \ a logo_url string, or multipart/form-data with an optional logo file upload."
      parameters:
      - description: Authorization
        in: header
        name: X-Auth
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/_organizations_post_request'
          application/json:
            schema:
              $ref: '#/components/schemas/_organizations_post_request'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.Organization'
          description: Created organization details
        "400":
          content:
            application/json:
              schema:
                type: object
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                type: object
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                type: object
          description: Internal server error
      security:
      - JWTAuth: []
      summary: Create a new organization
      tags:
      - auth
      x-codegen-request-body-name: request
  /organizations/{org_id}:
    get:
      description: "Gets complete organization details, including its users. The authenticated\
        \ user must belong to the requested organization."
      parameters:
      - description: Authorization
        in: header
        name: X-Auth
        required: true
        schema:
          type: string
      - description: Organization ID
        in: path
        name: org_id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.OrganizationDetails'
          description: OK
        "401":
          content:
            application/json:
              schema:
                type: object
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                type: object
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                type: object
          description: Not Found
      security:
      - JWTAuth: []
      summary: Get organization details
      tags:
      - auth
  /permissions:
    post:
      description: Create a new permission in the system
      parameters:
      - description: Authorization
        in: header
        name: X-Auth
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/types.CreatePermissionBody'
        description: Permission object
        required: true
      responses:
        "201":
          content: {}
          description: Created
      summary: Create new permission
      tags:
      - permissions
      x-codegen-request-body-name: permission
  /roles:
    get:
      description: Get paginated list of roles with user count
      parameters:
      - description: Authorization
        in: header
        name: X-Auth
        required: true
        schema:
          type: string
      - description: Page number
        in: query
        name: page
        schema:
          default: 1
          type: integer
      - description: Page size
        in: query
        name: page_size
        schema:
          default: 10
          type: integer
      - description: Filter by role name
        in: query
        name: role_name
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/types.ListRolesPagedResponse'
          description: OK
      summary: List roles
      tags:
      - roles
    post:
      description: Create a new role in the system
      parameters:
      - description: Authorization
        in: header
        name: X-Auth
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/bigbucks_solution_auth_rest-api_controllers_types.Role'
        description: Role object
        required: true
      responses:
        "201":
          content: {}
          description: Created
      summary: Create new role
      tags:
      - roles
      x-codegen-request-body-name: role
  /roles/{role_id}:
    delete:
      description: Delete an existing role if it has no associated users
      parameters:
      - description: Authorization
        in: header
        name: X-Auth
        required: true
        schema:
          type: string
      - description: Role ID
        in: path
        name: role_id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/types.SimpleResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/types.SimpleResponse'
          description: Role has associated users
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/types.SimpleResponse'
          description: Role not found
      summary: Delete existing role
      tags:
      - roles
    put:
      description: Update an existing role in the system
      parameters:
      - description: Authorization
        in: header
        name: X-Auth
        required: true
        schema:
          type: string
      - description: Role ID
        in: path
        name: role_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/bigbucks_solution_auth_rest-api_controllers_types.Role'
        description: Role object
        required: true
      responses:
        "201":
          content: {}
          description: Created
      summary: Update existing role
      tags:
      - roles
      x-codegen-request-body-name: role
  /roles/{role_id}/permissions:
    post:
      description: Lists permissions of a role
      parameters:
      - description: Authorization
        in: header
        name: X-Auth
        required: true
        schema:
          type: string
      - description: Role ID
        in: path
        name: role_id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/types.ListRolePermission'
                type: array
          description: OK
      summary: List permission of a role
      tags:
      - roles
  /roles/bind-permission:
    post:
      description: Associates a permission with a role
      parameters:
      - description: Authorization
        in: header
        name: X-Auth
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/types.RolePermissionBindingBody'
        description: Binding details
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                type: string
          description: Permission bound successfully
      summary: Bind permission to role
      tags:
      - roles
      x-codegen-request-body-name: rolepermission
  /roles/bind-user:
    post:
      description: Associates a role with a user in an organization
      parameters:
      - description: Authorization
        in: header
        name: X-Auth
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/types.UserRoleBindingBody'
        description: User role binding details
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                type: string
          description: Role bound to user successfully
      summary: Bind role to user
      tags:
      - roles
      x-codegen-request-body-name: binding
  /roles/unbind-permission:
    post:
      description: Removes a permission with a role
      parameters:
      - description: Authorization
        in: header
        name: X-Auth
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/types.RolePermissionBindingBody'
        description: UnBinding details
        required: true
      responses:
        "200":
          content:
